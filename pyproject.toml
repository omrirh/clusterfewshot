[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterfewshot"
version = "0.1.0"
description = "Semantic-clustering-based few-shot demonstration selection for DSPy"
readme = "README.md"
authors = [
    { name = "Omri Bar Haim", email = "omribarhaim@mail.tau.ac.il" },
    { name = "Shahar Katz", email = "shaharkatz3@mail.tau.ac.il" },
    { name = "Lior Wolf", email = "wolf@cs.tau.ac.il" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "dspy",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=3.0.0",
    "datasets>=2.14.6",
]

[project.optional-dependencies]
dev = ["pytest>=6.2.5"]

[project.urls]
Homepage = "https://github.com/omrirh/clusterfewshot"

[tool.setuptools.packages.find]
include = ["clusterfewshot", "clusterfewshot.*"]
